<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="700" rx="24" fill="url(#bgGrad)"/>

  <!-- Main Window Frame with outer glow border -->
  <rect x="30" y="25" width="1140" height="650" rx="18" fill="#121212" stroke="#D6A85A" stroke-opacity="0.5" stroke-width="2" filter="url(#shadow)"/>

  <!-- Window Header / Titlebar -->
  <rect x="30" y="25" width="1140" height="46" rx="18" fill="#0D0D0D"/>
  <rect x="30" y="55" width="1140" height="16" fill="#0D0D0D"/>
  <line x1="30" y1="71" x2="1170" y2="71" stroke="#D6A85A" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="58" cy="48" r="7" fill="#FF5F56"/>
  <circle cx="80" cy="48" r="7" fill="#FFBD2E"/>
  <circle cx="102" cy="48" r="7" fill="#27C93F"/>

  <!-- Window Title -->
  <text x="600" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6E6350" text-anchor="middle">zipnation-vip-themes — ZN Night Gold — VS Code</text>

  <!-- Theme Brand Pill in Titlebar -->
  <rect x="990" y="37" width="160" height="22" rx="11" fill="#2A2010" stroke="#D6A85A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1070" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#F5C563" text-anchor="middle" letter-spacing="1">FREE · NIGHT GOLD</text>

  <!-- Left Sidebar -->
  <rect x="30" y="71" width="220" height="574" fill="#0D0D0D"/>
  <line x1="250" y1="71" x2="250" y2="645" stroke="#D6A85A" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Sidebar Header -->
  <text x="50" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#6E6350" letter-spacing="1">EXPLORER</text>

  <!-- Tree Items -->
  <text x="50" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#F5E7C8">▼ <tspan font-weight="700">PROJECT</tspan></text>
  
  <!-- Active File -->
  <rect x="42" y="152" width="196" height="30" rx="6" fill="#D6A85A" fill-opacity="0.18"/>
  <text x="60" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#D6A85A">📄 App.tsx</text>

  <text x="60" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#6E6350">📄 theme.config.ts</text>
  <text x="60" y="244" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#6E6350">📄 styles.css</text>
  <text x="60" y="278" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#6E6350">📄 package.json</text>

  <!-- Sidebar Bottom Theme Badge -->
  <rect x="45" y="555" width="190" height="65" rx="10" fill="#2A2010" stroke="#D6A85A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="60" y="582" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="800" fill="#D6A85A">ZIPNATION</text>
  <text x="60" y="604" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#6E6350">ZN Night Gold</text>

  <!-- Editor Tab Bar -->
  <rect x="250" y="71" width="920" height="38" fill="#0D0D0D"/>
  <!-- Active Tab -->
  <rect x="250" y="71" width="170" height="38" fill="#121212"/>
  <line x1="250" y1="71" x2="420" y2="71" stroke="#D6A85A" stroke-width="2.5"/>
  <line x1="420" y1="71" x2="420" y2="109" stroke="#D6A85A" stroke-opacity="0.2" stroke-width="1"/>
  <text x="272" y="95" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F5E7C8">📄 App.tsx</text>
  <text x="398" y="95" font-family="-apple-system, sans-serif" font-size="14" fill="#6E6350">×</text>

  <!-- Inactive Tab -->
  <text x="444" y="95" font-family="-apple-system, sans-serif" font-size="12" fill="#6E6350">theme.config.ts</text>
  <line x1="250" y1="109" x2="1170" y2="109" stroke="#D6A85A" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Code Editor Body -->
  <!-- Line Numbers -->
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="15" fill="#6E6350" opacity="0.6">
    <text x="282" y="150">1</text>
    <text x="282" y="184">2</text>
    <text x="282" y="218">3</text>
    <text x="282" y="252">4</text>
    <text x="282" y="286">5</text>
    <text x="282" y="320">6</text>
    <text x="282" y="354">7</text>
    <text x="282" y="388">8</text>
    <text x="282" y="422">9</text>
    <text x="274" y="456">10</text>
    <text x="274" y="490">11</text>
    <text x="274" y="524">12</text>
    <text x="274" y="558">13</text>
  </g>

  <!-- Code Syntax Tokens -->
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="15" font-weight="500">
    <text x="320" y="150">
      <tspan fill="#D6A85A">import</tspan>
      <tspan fill="#F5E7C8"> { </tspan>
      <tspan fill="#E0B568">defineConfig</tspan>
      <tspan fill="#F5E7C8">, </tspan>
      <tspan fill="#FFF0D0">ThemeContext</tspan>
      <tspan fill="#F5E7C8"> } </tspan>
      <tspan fill="#D6A85A">from</tspan>
      <tspan fill="#F5C563"> 'zipnation'</tspan>
      <tspan fill="#F5E7C8">;</tspan>
    </text>

    <text x="320" y="218">
      <tspan fill="#D6A85A">export interface</tspan>
      <tspan fill="#FFF0D0"> ThemePalette</tspan>
      <tspan fill="#F5E7C8"> {</tspan>
    </text>

    <text x="345" y="252">
      <tspan fill="#F5E7C8">name: </tspan>
      <tspan fill="#FFF0D0">string</tspan>
      <tspan fill="#F5E7C8">;</tspan>
    </text>

    <text x="345" y="286">
      <tspan fill="#F5E7C8">accent: </tspan>
      <tspan fill="#FFF0D0">string</tspan>
      <tspan fill="#F5E7C8">;</tspan>
    </text>

    <text x="345" y="320">
      <tspan fill="#F5E7C8">vipActive: </tspan>
      <tspan fill="#FFF0D0">boolean</tspan>
      <tspan fill="#F5E7C8">;</tspan>
    </text>

    <text x="320" y="354" fill="#F5E7C8">}</text>

    <text x="320" y="422">
      <tspan fill="#D6A85A">export const</tspan>
      <tspan fill="#E0B568"> activeTheme</tspan>
      <tspan fill="#F5E7C8">: </tspan>
      <tspan fill="#FFF0D0">ThemePalette</tspan>
      <tspan fill="#F5E7C8"> = {</tspan>
    </text>

    <text x="345" y="456">
      <tspan fill="#F5E7C8">name: </tspan>
      <tspan fill="#F5C563">'ZN Night Gold'</tspan>
      <tspan fill="#F5E7C8">,</tspan>
    </text>

    <text x="345" y="490">
      <tspan fill="#F5E7C8">accent: </tspan>
      <tspan fill="#F5C563">'#D6A85A'</tspan>
      <tspan fill="#F5E7C8">,</tspan>
    </text>

    <text x="345" y="524">
      <tspan fill="#F5E7C8">vipActive: </tspan>
      <tspan fill="#D6A85A">true</tspan>
    </text>

    <text x="320" y="558" fill="#F5E7C8">};</text>
  </g>

  <!-- Floating Feature Callout Card -->
  <g filter="url(#shadow)">
    <rect x="760" y="330" width="370" height="230" rx="14" fill="#0A0A0A" stroke="#D6A85A" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="760" y="330" width="370" height="6" rx="3" fill="#D6A85A"/>
    
    <text x="790" y="375" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="900" fill="#F5E7C8">ZN Night Gold</text>
    <rect x="790" y="392" width="130" height="22" rx="4" fill="#2A2010" stroke="#D6A85A" stroke-width="1"/>
    <text x="855" y="407" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#D6A85A" text-anchor="middle">FREE · NIGHT GOLD</text>

    <!-- Color Swatches -->
    <circle cx="802" cy="445" r="12" fill="#D6A85A" stroke="#F5E7C8" stroke-width="1.5"/>
    <circle cx="836" cy="445" r="12" fill="#F5C563" stroke="#F5E7C8" stroke-width="1.5"/>
    <circle cx="870" cy="445" r="12" fill="#D6A85A" stroke="#F5E7C8" stroke-width="1.5"/>
    <circle cx="904" cy="445" r="12" fill="#F5C563" stroke="#F5E7C8" stroke-width="1.5"/>
    <circle cx="938" cy="445" r="12" fill="#FFF0D0" stroke="#F5E7C8" stroke-width="1.5"/>

    <!-- Use Theme Button simulation -->
    <rect x="790" y="482" width="310" height="48" rx="10" fill="#D6A85A" fill-opacity="0.22" stroke="#D6A85A" stroke-width="2"/>
    <text x="945" y="513" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#F5E7C8" text-anchor="middle" letter-spacing="1">✓ APPLY THEME</text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="30" y="645" width="1140" height="30" rx="0" fill="#0D0D0D"/>
  <rect x="30" y="655" width="1140" height="20" rx="18" fill="#0D0D0D"/>
  <line x1="30" y1="645" x2="1170" y2="645" stroke="#D6A85A" stroke-opacity="0.2" stroke-width="1"/>

  <text x="50" y="665" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#D6A85A">⎇ main*</text>
  <text x="120" y="665" font-family="-apple-system, sans-serif" font-size="11" fill="#6E6350">0 errors, 0 warnings</text>
  <text x="1000" y="665" font-family="-apple-system, sans-serif" font-size="11" fill="#6E6350">UTF-8</text>
  <text x="1070" y="665" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F5E7C8">TypeScript JSX</text>
</svg>